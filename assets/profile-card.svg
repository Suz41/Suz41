  <defs>
    <linearGradient id="sc-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#16a34a"/><stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" fill="#f7f7f5"/>
  <rect x="0" y="0" width="1200" height="5" fill="url(#sc-rule)"/>

  <g>
    <rect x="72" y="46" width="150" height="34" rx="17" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
    <circle cx="94" cy="63" r="5" fill="#16a34a">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="110" y="68" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#14532d" letter-spacing="3">BUILDING</text>
