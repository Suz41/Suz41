  </g>

  <text x="640" y="238" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#8a8a84" letter-spacing="3.5">STACK</text>
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#5a5a62">
