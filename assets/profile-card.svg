  <text x="72" y="140" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, sans-serif" font-size="52" font-weight="800" fill="#131316" letter-spacing="-1.5">Sujal Achari</text>
  <text x="72" y="172" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" fill="#4a4a52">Vibe coder crafting quiet software · Android · web · open source</text>

