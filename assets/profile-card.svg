  <g>
    <rect x="876" y="356" width="252" height="42" rx="6" fill="#131316"/>
    <text x="1002" y="383" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#f7f7f5" letter-spacing="1">sujalacharii@gmail.com →</text>
